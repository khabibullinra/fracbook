name: CI publish

# Триггерится ТОЛЬКО на push в master.
# - PR в master не триггерит этот workflow (его ловит test.yaml).
# - Push в dev не триггерит (тоже test.yaml).
# Никаких `if:` для фильтрации — `on:` уже всё фильтрует на уровне event.
on:
  push:
    branches: [master]

jobs:
  test:
    # Smoke-тест перед публикацией: pytest + ruff + quarto render.
    # Render здесь, а не в test.yaml, чтобы PR-проверки были быстрее.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Quarto
        shell: bash
        run: |
          set -euo pipefail
          QV=$(cat .quarto-version)
          wget -qO /tmp/quarto.tar.gz \
            "https://github.com/quarto-dev/quarto-cli/releases/download/v${QV}/quarto-${QV}-linux-amd64.tar.gz"
          sudo mkdir -p /opt/quarto
          sudo tar -xzf /tmp/quarto.tar.gz -C /opt/quarto --strip-components=1
          sudo ln -sf /opt/quarto/bin/quarto /usr/local/bin/quarto
          quarto --version

      - name: Install package and dev deps
        run: pip install -e .[dev]

      - name: Print versions
        run: |
          python --version
          ruff --version
          pytest --version
          quarto --version

      - name: Lint
        run: ruff check src tests

      - name: Tests
        run: pytest -q

      - name: Render book (smoke-test .qmd)
        run: quarto render book/

      - name: Upload built book
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: book-html
          path: book/_book
          retention-days: 7

  publish:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Download rendered book
        uses: actions/download-artifact@v4
        with:
          name: book-html
          path: book/_book

      - name: Checkout pages branch
        uses: actions/checkout@v4
        with:
          ref: pages
          # Токен из секретов репо. Создаётся вручную в UI:
          # Settings → Secrets → New secret → PAGES_TOKEN
          # (минимальные права: Repository: Write).
          token: ${{ secrets.PAGES_TOKEN }}
          path: .worktrees/pages
          fetch-depth: 0

      - name: Clear pages worktree (keep .git)
        working-directory: .worktrees/pages
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -not -path './.git' -exec rm -rf {} +

      - name: Copy rendered book to pages worktree
        run: cp -rT book/_book/ .worktrees/pages/

      - name: Copy 404.html
        run: |
          if [ -f tools/404.html ]; then
            cp tools/404.html .worktrees/pages/404.html
          else
            echo "Warning: tools/404.html not found, skipping"
          fi

      - name: Commit and push to pages
        working-directory: .worktrees/pages
        run: |
          set -euo pipefail
          git config user.name "fracbook-pages-bot"
          git config user.email "fracbook-pages-bot@khabibullinra.gitverse.ru"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "publish: $(date -u +%Y-%m-%d)"
          git push --force-with-lease origin pages
          echo "Published. Site: https://khabibullinra.gitverse.site/fracbook/"
