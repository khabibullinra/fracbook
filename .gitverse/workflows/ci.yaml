name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Quarto
        shell: bash
        run: |
          set -euo pipefail
          QV=$(cat .quarto-version)
          wget -qO /tmp/quarto.tar.gz \
            "https://github.com/quarto-dev/quarto-cli/releases/download/v${QV}/quarto-${QV}-linux-amd64.tar.gz"
          sudo mkdir -p /opt/quarto
          sudo tar -xzf /tmp/quarto.tar.gz -C /opt/quarto --strip-components=1
          sudo ln -sf /opt/quarto/bin/quarto /usr/local/bin/quarto
          quarto --version

      - name: Install package and dev deps
        run: pip install -e .[dev]

      - name: Print versions
        run: |
          python --version
          pip --version
          ruff --version
          pytest --version
          quarto --version

      - name: Lint
        run: ruff check src tests

      - name: Tests
        run: pytest -q

      - name: Render book (smoke-test .qmd)
        run: quarto render book/

      - name: Upload built book
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: book-html
          path: book/_book
          retention-days: 7
