name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Quarto
        shell: bash
        run: |
          set -euo pipefail
          QV=$(cat .quarto-version)
          wget -qO /tmp/quarto.tar.gz \
            "https://github.com/quarto-dev/quarto-cli/releases/download/v${QV}/quarto-${QV}-linux-amd64.tar.gz"
          sudo mkdir -p /opt/quarto
          sudo tar -xzf /tmp/quarto.tar.gz -C /opt/quarto --strip-components=1
          sudo ln -sf /opt/quarto/bin/quarto /usr/local/bin/quarto
          quarto --version

      - name: Install package and dev deps
        run: pip install -e .[dev]

      - name: Print versions
        run: |
          python --version
          pip --version
          ruff --version
          pytest --version
          quarto --version

      - name: Lint
        run: ruff check src tests

      - name: Tests
        run: pytest -q

      - name: Render book (smoke-test .qmd)
        run: quarto render book/

      - name: Upload built book
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: book-html
          path: book/_book
          retention-days: 7

  publish:
    # Только при push в master (не PR, не push в dev).
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          # Нужен токен с правами push в `pages`.
          token: ${{ secrets.PAGES_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Quarto
        shell: bash
        run: |
          set -euo pipefail
          QV=$(cat .quarto-version)
          wget -qO /tmp/quarto.tar.gz \
            "https://github.com/quarto-dev/quarto-cli/releases/download/v${QV}/quarto-${QV}-linux-amd64.tar.gz"
          sudo mkdir -p /opt/quarto
          sudo tar -xzf /tmp/quarto.tar.gz -C /opt/quarto --strip-components=1
          sudo ln -sf /opt/quarto/bin/quarto /usr/local/bin/quarto
          quarto --version

      - name: Install package and dev deps
        run: pip install -e .[dev]

      - name: Render book for publishing
        # Повторный render (не rely на артефакт test-job — кросс-job совместимость
        # в GitVerse Actions не документирована так же, как в GitHub).
        run: quarto render book/

      - name: Checkout pages branch
        uses: actions/checkout@v4
        with:
          ref: pages
          token: ${{ secrets.PAGES_TOKEN }}
          path: .worktrees/pages
          fetch-depth: 0

      - name: Clear pages worktree (keep .git)
        working-directory: .worktrees/pages
        run: |
          set -euo pipefail
          # Удалить все файлы и папки верхнего уровня, кроме .git
          find . -mindepth 1 -maxdepth 1 -not -path './.git' -exec rm -rf {} +

      - name: Copy rendered book to pages worktree
        run: cp -rT book/_book/ .worktrees/pages/

      - name: Copy 404.html
        run: |
          if [ -f tools/404.html ]; then
            cp tools/404.html .worktrees/pages/404.html
          else
            echo "Warning: tools/404.html not found, skipping"
          fi

      - name: Commit and push to pages
        working-directory: .worktrees/pages
        run: |
          set -euo pipefail
          git config user.name "fracbook-pages-bot"
          git config user.email "fracbook-pages-bot@khabibullinra.gitverse.ru"
          git add -A
          # Если изменений нет — выходим без push
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "publish: $(date -u +%Y-%m-%d)"
          git push --force-with-lease origin pages
          echo "Published. Site: https://khabibullinra.gitverse.site/fracbook/"
