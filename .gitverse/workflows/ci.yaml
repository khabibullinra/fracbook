name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install package and dev deps
        run: pip install -e .[dev]

      - name: Print versions
        run: |
          python --version
          pip --version
          ruff --version
          pytest --version

      - name: Lint
        run: ruff check src tests

      - name: Tests
        run: pytest -q

      - name: Install Quarto
        run: |
          wget -qO /tmp/quarto.tar.gz \
            https://github.com/quarto-dev/quarto-cli/releases/download/v1.9.38/quarto-1.9.38-linux-amd64.tar.gz
          mkdir -p $HOME/.local/share/quarto-1.9.38
          tar -xzf /tmp/quarto.tar.gz -C $HOME/.local/share/quarto-1.9.38 --strip-components=1
          ln -sf $HOME/.local/share/quarto-1.9.38/bin/quarto $HOME/.local/bin/quarto
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Quarto version
        run: quarto --version

      - name: Quarto render check (book)
        run: quarto render book/ --output-dir /tmp/ci-book --quiet

      - name: Quarto render check (notebooks)
        run: quarto render notebooks/ --output-dir /tmp/ci-notebooks --quiet
