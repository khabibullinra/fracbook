name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install package and dev deps
        run: pip install -e .[dev]

      - name: Print versions
        run: |
          python --version
          pip --version
          ruff --version
          pytest --version

      - name: Lint
        run: ruff check src tests

      - name: Tests
        run: pytest -q