name: CI publish

# Только на push в master (default branch на обоих ремотах).
# PR в master не триггерит этот workflow (его ловит test.yml).
# В отличие от GitVerse-варианта (publish.yaml), тут используется
# встроенный механизм GitHub Pages (actions/deploy-pages) — не нужна
# отдельная ветка pages и не нужен PAGES_TOKEN, всё через GITHUB_TOKEN.
on:
  push:
    branches: [master]

# Pages-deploy требует явных permissions.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Quarto
        shell: bash
        run: |
          set -euo pipefail
          QV=$(cat .quarto-version)
          wget -qO /tmp/quarto.tar.gz \
            "https://github.com/quarto-dev/quarto-cli/releases/download/v${QV}/quarto-${QV}-linux-amd64.tar.gz"
          sudo mkdir -p /opt/quarto
          sudo tar -xzf /tmp/quarto.tar.gz -C /opt/quarto --strip-components=1
          sudo ln -sf /opt/quarto/bin/quarto /usr/local/bin/quarto
          quarto --version

      - name: Install package and dev deps
        run: pip install -e .[dev]

      - name: Print versions
        run: |
          python --version
          ruff --version
          pytest --version
          quarto --version

      - name: Lint
        run: ruff check src tests

      - name: Tests
        run: pytest -q

      - name: Render book (smoke-test .qmd)
        run: quarto render book/

      # configure-pages@v5 НЕ умеет создавать Pages-сайт через GITHUB_TOKEN —
      # POST /repos/{owner}/{repo}/pages требует `administration:write`,
      # а встроенный GITHUB_TOKEN это разрешение получить не может
      # (см. actions/configure-pages#40). Поэтому Pages должен быть
      # включён вручную в Settings → Pages → Source: GitHub Actions ОДИН РАЗ.
      # configure-pages здесь только проверяет, что сайт уже настроен.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/_book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # ВНИМАНИЕ: блок `environment: github-pages` намеренно убран.
    # При включении GitHub Pages в UI создаётся environment
    # `github-pages` с `custom_branch_policies: true` и в whitelist
    # сидит `main` (default branch на момент включения). Удаление
    # ветки `main` и смена default branch НЕ обновляют этот список
    # автоматически, а API environments не позволяет его править
    # без admin-токена. В результате deploy job падает за 2 секунды
    # с `Branch "master" is not allowed to deploy to github-pages
    # due to environment protection rules`.
    # Чтобы вернуть branch protection, добавь `master` вручную:
    # Settings → Environments → github-pages → Deployment branches
    # → Selected branches → добавь `master`. После этого раскомментируй
    # блок `environment` ниже.

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
